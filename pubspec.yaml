name: comic_optimizer
description: "A simple GUI to optimize comics with pingo."
publish_to: "none"
version: 0.3.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.0.0-beta.7
  shared_preferences: ^2.1.5
  archive: ^4.0.7
  path: ^1.8.3
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  riverpod: ^3.3.2
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
